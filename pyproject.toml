[project]
name = "driftguard"
version = "0.1.0"
description = "Real-Time Fraud Detection API with Automated Data Drift Recovery"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
